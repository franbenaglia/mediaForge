# Memoria y paralelismo acotados: la máquina de desarrollo tiene 15 GB de RAM, 2 GB de swap,
# y se colgó con 4 workers y 2 GB de heap (2026-11-07). Ver CLAUDE.md, "Entorno".
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
kotlin.code.style=official
